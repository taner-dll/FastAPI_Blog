{% extends "layout.html" %}

{% block content %}
    <h1>Blog Posts</h1>
    <ul>
        {% for post in posts %}
            <li>
                <h2>{{ post.title }}</h2>
                <p>{{ post.content }}</p>
            </li>
        {%else %}
            <li>No posts available.</li>
        {% endfor %}
    </ul>
{% endblock %}
