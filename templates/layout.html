<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    <script src="{{ url_for('static', path='js/auth.js') }}"></script>
</head>

<body>
    <header class="site-header">
        <div class="container nav-container">
            <div class="brand">FastAPI Blog</div>
            <nav class="main-nav" aria-label="Ana navigasyon">
                <a href="/">Ana Sayfa</a>
                <a href="/blog">Blog</a>
                <a href="/posts/create" id="create-post-link" style="display:none;">Yeni Yazı</a>
                <a href="/auth" id="auth-link">Giriş</a>
                <a href="/profile-page" id="profile-link" style="display:none;">Profil</a>
                <button id="logout-link" style="display:none;">Çıkış</button>
            </nav>
        </div>
    </header>

    <main class="container main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>FastAPI Blog</p>
        </div>
    </footer>
</body>

</html>
